<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07102c"><link rel="manifest" href="manifest.json"><title>DBL Summon Fan V3</title><style>
*{box-sizing:border-box}body{margin:0;background:#02030c;color:#fff;font-family:system-ui,Arial}.app{max-width:650px;margin:auto;min-height:100vh;padding:16px;background:linear-gradient(155deg,#07143a,#250b2d,#052838)}h1{text-align:center;font-size:26px;margin:5px}.muted{text-align:center;opacity:.7;font-size:12px}.panel,.banner{margin:12px 0;padding:15px;border:1px solid #ffffff25;border-radius:20px;background:#ffffff0c}.stats{display:flex;justify-content:space-between;font-weight:900}.banner{background:linear-gradient(135deg,#42187d,#123e78);min-height:120px}.banner h2{margin:7px 0}.tag{background:#ffd34c;color:#211500;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:900}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:15px;padding:14px;font-size:15px;font-weight:900;color:#fff;background:linear-gradient(135deg,#f07b16,#d42e68)}button.secondary{background:#ffffff12;border:1px solid #ffffff25}.tabs{display:flex;gap:8px}.tabs button{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.unit{padding:12px;border-radius:14px;background:#ffffff0b;border:1px solid #ffffff20}.unit b{display:block}.hidden{display:none}
#scene{display:none;position:fixed;inset:0;z-index:10;background:#01020a;overflow:hidden}.space{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#1854a5,#07102e 35%,#01020a 75%)}.stars{position:absolute;inset:-50px;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:47px 47px;opacity:.45;animation:stars 1.5s linear infinite}@keyframes stars{to{transform:translateY(47px)}}.orb{position:absolute;left:calc(50% - 35px);top:43%;width:70px;height:70px;border-radius:50%;background:#ffd64b;box-shadow:0 0 50px 20px #ff9d1a;animation:pulse .4s infinite alternate}@keyframes pulse{to{transform:scale(1.7)}}.beam{position:absolute;left:50%;top:0;width:6px;height:100%;background:#fff;box-shadow:0 0 30px 15px #43caff;transform:translateX(-50%) scaleY(0);animation:beam .7s 1.3s forwards}@keyframes beam{to{transform:translateX(-50%) scaleY(1)}}.clash{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:34px;font-weight:1000;text-shadow:0 0 25px #fff;animation:shake .12s 2s 8}@keyframes shake{50%{transform:translate(8px,-6px)}}.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .25s 2.8s forwards}@keyframes flash{30%{opacity:1}to{opacity:0}}.reveal{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;opacity:0;animation:show .5s 3.1s forwards}@keyframes show{to{opacity:1}}.card{width:min(92vw,420px);padding:30px;border-radius:28px;border:4px solid white;background:linear-gradient(145deg,#58167c,#b16a18,#1d1255);box-shadow:0 0 70px #ffcc66aa}.card.ultra{background:linear-gradient(145deg,#b47716,#22140a,#6d2088)}.card.spark{background:linear-gradient(145deg,#173f90,#172758)}.rarity{font-size:25px;font-weight:1000}.char{font-size:27px;font-weight:900;margin:18px 0}.close{margin-top:20px;background:#ffffff18}</style></head><body><main class="app"><h1>⚡ DBL SUMMON FAN V3</h1><div class="muted">Original fan-made summon simulator</div><div class="panel stats"><span>💎 <span id="cc">10,000</span></span><span>🎯 Pity <span id="pity">0</span>/50</span></div><div class="banner"><span class="tag">LEGEND BANNER</span><h2>Beyond the Limit</h2>Featured: SSB Kaioken Goku • Final Form Cooler</div><div class="buttons"><button onclick="summon(1)">✨ SUMMON ×1<br>100 CC</button><button onclick="summon(10)">🔥 SUMMON ×10<br>1,000 CC</button></div><div class="muted">10-pull guarantees SPARKING or better.</div><div class="panel tabs"><button class="secondary" onclick="tab('collection')">📖 Collection</button><button class="secondary" onclick="tab('history')">📜 History</button><button class="secondary" onclick="resetSave()">♻️ Reset</button></div><section id="collection" class="panel"><h3>Collection</h3><div id="grid" class="grid"></div></section><section id="history" class="panel hidden"><h3>Summon History</h3><div id="hist"></div></section></main><div id="scene"><div class="space"></div><div class="stars"></div><div class="orb"></div><div class="beam"></div><div id="clash" class="clash">ENERGY<br>CHARGING...</div><div class="flash"></div><div class="reveal"><div id="card" class="card"><div id="rarity" class="rarity"></div><div id="char" class="char"></div><div id="element"></div><button class="close" onclick="closeScene()">CONTINUE</button></div></div></div>
<script>const R=[["LEGEND","SSB Kaioken Goku","BLUE"],["LEGEND","Final Form Cooler","RED"],["ULTRA","Ultra Instinct Goku","PURPLE"],["ULTRA","Super Saiyan Blue Gogeta","RED"],["ULTRA","Broly: Full Power","GREEN"],["SPARKING","Super Vegito","PURPLE"],["SPARKING","Gohan (Youth)","YELLOW"],["SPARKING","Android #17 & Golden Frieza","GREEN"],["SPARKING","Super Saiyan 3 Goku","PURPLE"],["SPARKING","Piccolo","GREEN"],["EXTREME","Trunks (Teen)","BLUE"],["EXTREME","Piccolo","GREEN"],["HERO","Saibaman","RED"]];let S=JSON.parse(localStorage.dblv3||'{"cc":10000,"pity":0,"collection":{},"history":[]}');const $=x=>document.getElementById(x);function save(){localStorage.dblv3=JSON.stringify(S)}function update(){cc.textContent=S.cc.toLocaleString();pity.textContent=S.pity;grid.innerHTML=Object.keys(S.collection).length?Object.keys(S.collection).map(i=>`<div class="unit"><b>${R[i][0]}</b>${R[i][1]}<small> ×${S.collection[i]}</small></div>`).join(""):"No characters yet.";hist.innerHTML=S.history.length?S.history.map(x=>`<div class="unit"><b>${x.rarity}</b>${x.name}<small>${x.time}</small></div>`).join(""):"No summons yet."}function pull(){S.pity++;if(S.pity>=50){S.pity=0;return Math.floor(Math.random()*2)}let x=Math.random()*10000;if(x<10)return Math.floor(Math.random()*2);if(x<60)return 2+Math.floor(Math.random()*3);if(x<700)return 5+Math.floor(Math.random()*5);if(x<3000)return 10+Math.floor(Math.random()*2);return 12}function summon(n){let cost=n==1?100:1000;if(S.cc<cost)return alert("Not enough Chrono Crystals!");S.cc-=cost;let a=[];for(let i=0;i<n;i++){let p=pull();if(n==10&&i==9&&R[p][0]=="HERO")p=5+Math.floor(Math.random()*5);a.push(p);S.collection[p]=(S.collection[p]||0)+1}S.history.unshift(...a.map(p=>({name:R[p][1],rarity:R[p][0],time:new Date().toLocaleString()})));S.history=S.history.slice(0,100);save();scene.style.display="block";clash.innerHTML="ENERGY<br>CHARGING...";setTimeout(()=>clash.innerHTML="💥 CLASH!",850);setTimeout(()=>clash.innerHTML="🔥 TRANSFORMATION!",1600);let p=a[a.length-1];setTimeout(()=>{rarity.textContent="★ "+R[p][0]+" ★";char.textContent=R[p][1];element.textContent="ELEMENT: "+R[p][2];card.className="card "+(R[p][0]=="ULTRA"?"ultra":R[p][0]=="SPARKING"?"spark":"")},3000)}function closeScene(){scene.style.display="none";update()}function tab(t){collection.classList.toggle("hidden",t!="collection");history.classList.toggle("hidden",t!="history")}function resetSave(){if(confirm("Reset all progress?")){S={cc:10000,pity:0,collection:{},history:[]};save();update()}}update();</script></body></html>
