<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050817">
<title>DBL Summon Fan V4</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#02030b;
  color:white;
  font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

.app{
  width:min(760px,100%);
  min-height:100vh;
  margin:auto;
  padding:12px;
  background:
    radial-gradient(circle at 50% -10%,#183b91 0,#0a1231 28%,transparent 55%),
    linear-gradient(155deg,#05091b,#180721,#031d2a);
}

h1{
  text-align:center;
  margin:7px 0 2px;
  font-size:27px;
  font-weight:1000;
  letter-spacing:.5px;
}

.subtitle{
  text-align:center;
  opacity:.65;
  font-size:12px;
  margin-bottom:13px;
}

.panel{
  margin:10px 0;
  padding:13px;
  border:1px solid #ffffff20;
  border-radius:20px;
  background:#ffffff09;
  backdrop-filter:blur(8px);
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  padding:12px;
  border-radius:15px;
  background:#ffffff0b;
  text-align:center;
  font-weight:900;
}

.stat span{
  display:block;
  font-size:11px;
  opacity:.6;
  margin-bottom:3px;
}

.stat b{
  font-size:20px;
}

.banner{
  min-height:205px;
  padding:17px;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  border:1px solid #ffffff30;
  box-shadow:0 15px 45px #0008;
}

.banner:after{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  border-radius:50%;
  right:-100px;
  top:-100px;
  background:#ffffff15;
  box-shadow:0 0 80px #ffffff20;
}

.bannerContent{
  position:relative;
  z-index:2;
}

.tag{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  background:#ffd84a;
  color:#160f00;
  font-size:11px;
  font-weight:1000;
}

.banner h2{
  font-size:25px;
  margin:12px 0 5px;
}

.banner p{
  margin:5px 0 15px;
  max-width:75%;
  opacity:.85;
}

.featured{
  font-size:12px;
  opacity:.9;
}

.bannerNav{
  display:grid;
  grid-template-columns:48px 1fr 48px;
  gap:8px;
  align-items:stretch;
}

button{
  border:0;
  border-radius:15px;
  padding:13px;
  color:white;
  font-weight:1000;
  font-size:14px;
  cursor:pointer;
  background:linear-gradient(135deg,#f47c18,#d52f6e);
  box-shadow:0 7px 20px #0005;
}

button:active{
  transform:scale(.97);
}

.arrow{
  background:#ffffff12;
  border:1px solid #ffffff20;
  font-size:25px;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:10px;
}

.summon1{
  background:linear-gradient(135deg,#1269d9,#7036dc);
}

.summon10{
  background:linear-gradient(135deg,#ed721b,#d82f68);
}

.guarantee{
  text-align:center;
  margin:8px 0;
  font-size:11px;
  opacity:.65;
}

.dots{
  text-align:center;
  margin:8px;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ffffff35;
  margin:3px;
}

.dot.on{
  background:#ffd34c;
  transform:scale(1.4);
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}

.secondary{
  background:#ffffff0b;
  border:1px solid #ffffff18;
  box-shadow:none;
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sectionTitle h3{
  margin:0;
}

.rates{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-top:10px;
}

.rate{
  padding:9px;
  border-radius:12px;
  background:#ffffff09;
  border:1px solid #ffffff15;
  font-size:12px;
}

.rate b{
  display:block;
  margin-bottom:2px;
}

.heroText{color:#9fb9ff}
.extremeText{color:#9fc5ff}
.sparkText{color:#ffe66a}
.llText{color:#ff9d32}
.ultraText{color:#ff5f42}
.legendText{
  color:#dba8ff;
  text-shadow:0 0 12px #9c42ff;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.unit{
  padding:11px;
  border-radius:14px;
  background:#ffffff09;
  border:1px solid #ffffff15;
}

.unit b{
  display:block;
  margin-bottom:4px;
}

.unit small{
  display:block;
  opacity:.55;
  margin-top:4px;
}

.rarityBadge{
  display:inline-block;
  padding:3px 7px;
  border-radius:8px;
  font-size:10px;
  font-weight:1000;
  margin-bottom:5px;
  background:#ffffff14;
}

.hidden{
  display:none!important;
}

.empty{
  text-align:center;
  opacity:.55;
  padding:18px;
}

/* SUMMON SCENE */

#scene{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  overflow:hidden;
  background:#01020a;
}

.space{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 42%,#2455bd 0,#0a1747 28%,#02030d 72%);
}

.stars{
  position:absolute;
  inset:-80px;
  background-image:
    radial-gradient(#fff 1px,transparent 1px),
    radial-gradient(#fff 1px,transparent 1px);
  background-size:47px 47px,83px 83px;
  opacity:.45;
  animation:stars 1.5s linear infinite;
}

@keyframes stars{
  to{transform:translateY(47px)}
}

.orb{
  position:absolute;
  left:calc(50% - 38px);
  top:43%;
  width:76px;
  height:76px;
  border-radius:50%;
  background:#ffe45d;
  box-shadow:
    0 0 35px 15px #ffad24,
    0 0 100px 40px #ff761855;
  animation:pulse .35s infinite alternate;
}

@keyframes pulse{
  to{transform:scale(1.65)}
}

.beam{
  position:absolute;
  left:50%;
  top:0;
  width:8px;
  height:100%;
  background:white;
  box-shadow:0 0 35px 18px #48cfff;
  transform:translateX(-50%) scaleY(0);
  animation:beam .7s 1.25s forwards;
}

@keyframes beam{
  to{transform:translateX(-50%) scaleY(1)}
}

.clash{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:34px;
  font-weight:1000;
  text-shadow:0 0 30px white;
  animation:shake .12s 1.9s 10;
}

@keyframes shake{
  50%{transform:translate(8px,-6px)}
}

.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  animation:flash .3s 2.65s forwards;
}

@keyframes flash{
  25%{opacity:1}
  to{opacity:0}
}

.reveal{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:18px;
  text-align:center;
  opacity:0;
  animation:show .5s 2.95s forwards;
}

@keyframes show{
  to{opacity:1}
}

.card{
  width:min(92vw,440px);
  padding:27px 20px;
  border-radius:28px;
  border:3px solid white;
  background:linear-gradient(145deg,#303c72,#17172d,#51206b);
  box-shadow:0 0 70px #ffffff55;
  animation:cardIn .45s 2.95s both;
}

@keyframes cardIn{
  from{transform:scale(.55) rotate(-5deg)}
  to{transform:scale(1) rotate(0)}
}

.card.hero{
  background:linear-gradient(145deg,#273d71,#101a37);
}

.card.extreme{
  background:linear-gradient(145deg,#34465d,#171b24);
}

.card.sparking{
  background:linear-gradient(145deg,#153d91,#1b285f,#10172c);
  box-shadow:0 0 75px #328cff;
}

.card.ll{
  background:linear-gradient(145deg,#8d3915,#3b160d,#69220d);
  box-shadow:0 0 85px #ff8a32;
}

.card.ultra{
  background:linear-gradient(145deg,#bd7416,#281307,#70218b);
  box-shadow:0 0 100px #ffc342;
  border-color:#ffe18a;
}

.card.legend{
  background:
    radial-gradient(circle at 50% 0,#d85bff55,transparent 45%),
    linear-gradient(145deg,#7b20c4,#16092e,#35107d);
  box-shadow:
    0 0 45px #d24dff,
    0 0 110px #762dff;
  border-color:#e3a5ff;
  animation:
    cardIn .45s 2.95s both,
    legendGlow 1s 3.45s infinite alternate;
}

@keyframes legendGlow{
  to{
    box-shadow:
      0 0 75px #ed72ff,
      0 0 150px #712dff;
  }
}

.rarity{
  font-size:28px;
  font-weight:1000;
  letter-spacing:1px;
}

.char{
  font-size:27px;
  font-weight:1000;
  margin:17px 0 12px;
}

.element{
  opacity:.85;
  font-size:13px;
}

.resultText{
  margin-top:12px;
  font-size:12px;
  opacity:.75;
}

.close{
  margin-top:20px;
  width:100%;
  background:#ffffff15;
  border:1px solid #ffffff25;
}

/* LEGEND SPECIAL */

.legendExplosion{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
}

.legendExplosion.active{
  animation:legendBurst 1.2s 2.65s forwards;
}

@keyframes legendBurst{
  0%{
    opacity:0;
    transform:scale(.1);
    background:radial-gradient(circle,#fff,transparent 5%);
  }
  35%{
    opacity:1;
    transform:scale(1);
    background:radial-gradient(circle,#fff 0,#b44cff 8%,transparent 45%);
  }
  100%{
    opacity:0;
    transform:scale(2);
  }
}

@media(max-width:480px){
  .app{padding:9px}
  .banner{min-height:220px}
  .banner p{max-width:100%}
  .rates{grid-template-columns:1fr 1fr}
}

@media(max-width:360px){
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<main class="app">

<h1>⚡ DBL SUMMON FAN V4</h1>
<div class="subtitle">
  Original fan-made summon simulator • No real purchases
</div>

<div class="panel stats">
  <div class="stat">
    <span>💎 CHRONO CRYSTALS</span>
    <b id="cc">10,000</b>
  </div>

  <div class="stat">
    <span>🎯 PITY</span>
    <b><span id="pity">0</span>/50</b>
  </div>
</div>

<div class="bannerNav">
  <button class="arrow" onclick="changeBanner(-1)">‹</button>
  <div id="banner" class="banner"></div>
  <button class="arrow" onclick="changeBanner(1)">›</button>
</div>

<div id="dots" class="dots"></div>

<div class="buttons">
  <button class="summon1" onclick="summon(1)">
    ✨ SUMMON ×1<br>
    100 CC
  </button>

  <button class="summon10" onclick="summon(10)">
    🔥 SUMMON ×10<br>
    1,000 CC
  </button>
</div>

<div class="guarantee">
  🔒 ×10 guarantees at least SPARKING or higher
</div>

<div class="panel">

  <div class="sectionTitle">
    <h3>🎯 Summon Rates</h3>
  </div>

  <div class="rates">

    <div class="rate">
      <b class="heroText">HERO</b>
      65.00%
    </div>

    <div class="rate">
      <b class="extremeText">EXTREME</b>
      25.00%
    </div>

    <div class="rate">
      <b class="sparkText">SPARKING
